name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Verify Python syntax and bytecode compilation
        run: |
          python -m compileall backend/app

      - name: Run backend test suite
        run: |
          pytest -v backend/tests

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund

      - name: Build frontend application
        working-directory: frontend
        run: |
          npm run build

  config-and-scripts:
    name: Shell Scripts & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate bash scripts syntax
        run: |
          bash -n deploy.sh scripts/*.sh

      - name: Validate Docker Compose configuration
        run: |
          ADMIN_PASSWORD=ci_admin_pass_12345 SESSION_SECRET=ci_session_secret_12345678901234567890 GRAFANA_PASSWORD=ci_grafana_pass_12345 docker compose config --quiet ADMIN_PASSWORD=ci_admin_pass_12345 SESSION_SECRET=ci_session_secret_12345678901234567890 docker compose config --quiet

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: |
          docker build -t kics-cloudrag-api:ci ./backend

      - name: Build frontend Docker image
        run: |
          docker build -t kics-cloudrag-web:ci ./frontend

